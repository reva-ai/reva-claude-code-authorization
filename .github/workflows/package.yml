name: Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build and Release Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Create .plugin package
        run: |
          # Package the codebase as a zip-compatible archive with .plugin extension,
          # excluding git metadata, build-time node_modules, and .DS_Store
          zip -r reva-claude-code-authorization.plugin . \
            -x "./.git/*" \
            -x "./node_modules/*" \
            -x "*.DS_Store"

      - name: Publish to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # If the 'latest' release does not exist yet, create it with the plugin asset
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest reva-claude-code-authorization.plugin \
              --title "Reva Claude Code Authorization Plugin" \
              --notes "Latest release of reva-claude-code-authorization.plugin from main branch" \
              --latest
          else
            # Update target commit to current commit and upload/replace the asset
            gh release edit latest --target "$GITHUB_SHA" || true
            gh release upload latest reva-claude-code-authorization.plugin --clobber
          fi

          echo "Plugin successfully published to GitHub Release!"
          echo "Direct Download URL: https://github.com/${{ github.repository }}/releases/latest/download/reva-claude-code-authorization.plugin" >> $GITHUB_STEP_SUMMARY
