name: Package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    name: Build and Package Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Create .plugin package
        run: |
          # Package the codebase as a zip-compatible archive with .plugin extension,
          # excluding git metadata and temporary build-time node_modules
          zip -r reva-claude-code-authorization.plugin . \
            -x "./.git/*" \
            -x "./node_modules/*" \
            -x "*.DS_Store"

      - name: Upload .plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: reva-claude-code-authorization.plugin
          path: reva-claude-code-authorization.plugin
          if-no-files-found: error
